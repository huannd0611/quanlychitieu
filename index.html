<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08765c"><meta name="description" content="FamilyMoney: quản lý thu chi chung và riêng cho gia đình">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>FamilyMoney V2 – Tài chính gia đình</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="authScreen" class="auth-shell hidden"><div class="auth-card">
<div class="brand big"><span class="brand-icon">⌂</span><span>FamilyMoney</span></div><p class="muted">Quản lý tài chính chung, tôn trọng tài chính riêng.</p>
<div class="segmented"><button id="tabLogin" class="selected" data-auth-tab="login">Đăng nhập</button><button id="tabSignup" data-auth-tab="signup">Tạo tài khoản</button></div>
<form id="authForm"><label>Email<input id="authEmail" type="email" autocomplete="email" required placeholder="ten@email.com"></label><label>Mật khẩu<input id="authPassword" type="password" minlength="6" autocomplete="current-password" required placeholder="Tối thiểu 6 ký tự"></label><button class="btn full" id="authSubmit" type="submit">Đăng nhập</button></form>
<p class="mini">Nếu email xác nhận được bật, vui lòng kiểm tra hộp thư trước khi đăng nhập.</p>
<button class="link" id="toDemo" type="button">Dùng chế độ mẫu, không cần tài khoản →</button>
</div></div>
<div id="appShell" class="app hidden"><aside class="sidebar"><div class="brand"><span class="brand-icon">⌂</span>FamilyMoney</div><div class="side-nav" id="sideNav"></div><div class="side-footer"><span id="modeName">Chế độ mẫu</span><button id="logoutSide" class="link" type="button">Thoát</button></div></aside>
<div class="content"><header class="header"><div><p class="eyebrow">FAMILYMONEY V2</p><h1 id="pageTitle">Tổng quan</h1></div><div class="header-actions"><span id="householdName" class="chip">Gia đình mẫu</span><button class="btn secondary" id="refreshBtn" type="button" title="Tải lại dữ liệu">↻ Làm mới</button></div></header>
<div id="alertArea"></div>
<section id="dashboard" class="page"></section>
<section id="transactions" class="page hidden"></section>
<section id="wallets" class="page hidden"></section>
<section id="budgets" class="page hidden"></section>
<section id="goals" class="page hidden"></section>
<section id="members" class="page hidden"></section>
<section id="insights" class="page hidden"></section>
<section id="settings" class="page hidden"></section>
</div><nav id="bottomNav" class="bottom-nav" aria-label="Điều hướng"></nav></div>
<div id="dialogBackdrop" class="dialog-backdrop hidden"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">Thêm giao dịch</h2><button id="closeDialog" class="icon-btn" aria-label="Đóng">✕</button></div><div id="dialogBody"></div></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="app.js"></script>
</body></html>
